<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Kisaan Setu</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/1000343623.png" alt="Kisaan Setu - Farmers to Wholesale Buyers" />
        <span class="brand-wordmark">
          <strong>Kisaan Setu</strong>
          <small>Farm Connect</small>
        </span>
      </a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="listings.html">Browse Produce</a>
        <a href="farmer-dashboard.html">Farmer</a>
        <a href="buyer-dashboard.html">Buyer</a>
        <a href="admin.html">Admin</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-button" aria-label="Notifications">☔</button>
        <a class="btn btn-secondary" href="login.html">Login</a>
        <button class="mobile-menu" aria-label="Open Menu">☰</button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-title">
      <div class="container page-title-grid">
        <div>
          <span class="kicker">Profile</span>
          <h1>Farm profile</h1>
          <p>Manage account, location, crops, and verification details.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <section class="auth-form-wrap">
          <form data-validate>
            <div class="form-grid">
              <div class="form-group">
                <label for="name">Full name</label>
                <input class="form-control" type="text" id="name" value="Ramesh Kumar" required />
              </div>
              <div class="form-group">
                <label for="phone">Phone number</label>
                <input class="form-control" type="tel" id="phone" value="+91 98765 43210" required />
              </div>
              <div class="form-group">
                <label for="location">Farm location</label>
                <input class="form-control" type="text" id="location" value="Nashik, Maharashtra" required />
              </div>
              <div class="form-group">
                <label for="crops">Primary crops</label>
                <input class="form-control" type="text" id="crops" value="Tomato, Onion, Chilli" required />
              </div>
              <div class="form-group">
                <label for="farm-size">Farm size</label>
                <input class="form-control" type="number" id="farm-size" value="15" required />
              </div>
              <div class="form-group">
                <label for="verification">Verification</label>
                <select class="form-select" id="verification" required>
                  <option selected>Verified</option>
                  <option>Pending</option>
                  <option>Not submitted</option>
                </select>
              </div>
            </div>
            <div class="row">
              <button class="btn btn-primary" type="submit">Save profile</button>
              <button class="btn btn-secondary" type="button">Cancel</button>
            </div>
          </form>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">© 2026 Kisaan Setu. All rights reserved.</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
